<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieFlex | Search</title>
    <meta name="description" content="Search for movies using TMDB." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://movieflex.ct.ws/search.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieFlex" />
    <meta property="og:title" content="MovieFlex | Search" />
    <meta property="og:description" content="Search for movies using TMDB." />
    <meta property="og:url" content="https://movieflex.ct.ws/search.html" />
    <meta property="og:image" content="https://movieflex.ct.ws/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MovieFlex | Search" />
    <meta name="twitter:description" content="Search for movies using TMDB." />
    <meta name="twitter:image" content="https://movieflex.ct.ws/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body data-page="search">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app-shell">
      <header id="site-header"></header>

      <main id="main-content">
        <section class="section search-section">
          <div class="container">
            <h1 class="section__title">Search Movies</h1>

            <form id="search-form" class="search-form" role="search" aria-label="Movie search form">
              <input
                id="search-input"
                type="search"
                placeholder="Search by title..."
                aria-label="Search movies"
                required
              />
              <button type="submit" class="btn btn--primary">Search</button>
            </form>

            <div class="ad-wrapper container">
              <div class="ad-wrapper__label">Advertisement</div>
              <script type="text/javascript">
                (function() {
                  const width = window.innerWidth;
                  let key = '11e1cdd074c500a0b8bf56db21d2f335'; // Default: Mobile 320x50
                  let adWidth = 320;
                  let adHeight = 50;

                  if (width >= 800) {
                    key = '0a590ed146e6df3241507dce9b9730a8'; // Desktop: 728x90
                    adWidth = 728;
                    adHeight = 90;
                  } else if (width >= 500) {
                    key = 'e1fb49094ed731e904f94d2c5e9e4963'; // Tablet: 468x60
                    adWidth = 468;
                    adHeight = 60;
                  }

                  window.atOptions = {
                    'key': key,
                    'format': 'iframe',
                    'height': adHeight,
                    'width': adWidth,
                    'params': {}
                  };

                  const currentScript = document.currentScript;
                  const parent = currentScript.parentElement;
                  const adContent = document.createElement('div');
                  adContent.className = 'ad-wrapper__content';
                  parent.appendChild(adContent);

                  const script = document.createElement('script');
                  script.type = 'text/javascript';
                  script.src = 'https://divorceabetpiano.com/' + key + '/invoke.js';
                  adContent.appendChild(script);
                })();
              </script>
            </div>

            <div id="search-state" class="state" aria-live="polite"></div>
            <div id="search-results" class="movie-grid"></div>
            <div class="section__actions">
              <button id="search-load-more" class="btn btn--ghost load-more hidden" type="button">
                Load more
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer id="site-footer"></footer>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
